name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [server, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node ../scripts/check-secrets.cjs
      - run: node ../scripts/audit-dependencies.cjs
      - if: matrix.project == 'mobile'
        run: node node_modules/expo/bin/cli export --platform android --output-dir dist --no-minify
